name: Build Debug APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      # ── 固定签名：若 Secrets 有 KEYSTORE_BASE64 则使用，否则生成一个并作为 artifact 供下载保存 ──
      - name: Setup signing keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks
            echo "keystore: using from secret"
          else
            keytool -genkeypair -v \
              -keystore keystore.jks \
              -alias locationalarm \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass LocationAlarm123 \
              -keypass LocationAlarm123 \
              -dname "CN=LocationAlarm, OU=Dev, O=LocationAlarm, L=Beijing, ST=Beijing, C=CN"
            echo "keystore: generated (password: LocationAlarm123)"
          fi

      - name: Print SHA1 fingerprint
        run: |
          echo "=== SHA1 FINGERPRINT (高德Key绑定用) ==="
          keytool -list -v -keystore keystore.jks -alias locationalarm -storepass LocationAlarm123 2>&1 | grep -E "SHA1:|MD5:|SHA256:" || true
          echo "=== END ==="

      - name: Configure signing
        run: |
          cat >> local.properties << 'EOF'
          STORE_FILE=keystore.jks
          STORE_PASSWORD=LocationAlarm123
          KEY_ALIAS=locationalarm
          KEY_PASSWORD=LocationAlarm123
          EOF

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationAlarm-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: LocationAlarm-keystore
          path: keystore.jks
          retention-days: 30
